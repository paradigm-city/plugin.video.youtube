name: Add-on Validations

on:
  push:
    branches: [ master, main ]
    branches: [ master, main, current_testing, tests ]

  pull_request:
    branches: [ master, main ]
    branches: [ master, main, current_testing, tests ]

jobs:
  addon-validations:
    if: github.repository == 'anxdpanic/plugin.video.youtube'
  lint:
    name: Lint & Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

    name: Add-on Validations
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Lint
        run: |
          ruff check tests

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.8', '3.9', '3.10', '3.11', '3.12', '3.13' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest with Coverage
        run: |
          pytest --cov=resources/lib/youtube_plugin --cov-report=xml --cov-report=term

  addon-validations:
    name: Kodi Add-on Checker
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.12' ]

    steps:
      - name: Checkout Add-on
        uses: actions/checkout@v4
        with:
          path: ${{ github.event.repository.name }}
          path: plugin.video.youtube

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install git+https://github.com/xbmc/addon-check.git

      - name: Kodi Add-on Checker (Nexus)
        id: kodi-addon-checker-nexus
        run: |
          kodi-addon-checker ${{ github.event.repository.name }} --branch=nexus
          kodi-addon-checker plugin.video.youtube --branch=nexus
